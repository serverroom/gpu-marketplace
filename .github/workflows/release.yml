name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod rather than a pinned version: the module already
          # requires a newer Go than the pin did, and a release build is the
          # worst place to discover a toolchain mismatch.
          go-version-file: go.mod

      # The same script, flags and toolchain the release signer uses
      # (RELEASING.md): it rebuilds these binaries itself and signs only when
      # every one matches GitHub's byte for byte.
      - name: Build
        run: sh scripts/release/build.sh "${GITHUB_REF_NAME}" . "${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gpu-agent-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The installers, and agents before v0.3.13, refuse a binary that does
      # not match this file, so it is not optional -- but it vouches for
      # nothing on its own: it sits in the same release as the binaries.
      # What an agent trusts is release.json, signed off GitHub (RELEASING.md).
      - name: Generate checksums
        run: sha256sum gpu-agent-* > checksums.txt

      # EVERY RELEASE STARTS AS A PRE-RELEASE (from v0.3.13). An agent from
      # v0.3.13 installs only a release whose release.json is signed by a
      # release key, and the keys never leave DEVEL61 -- so nothing this
      # workflow makes can be installed by itself. The release becomes the
      # latest (the one the marketplace offers every agent) only after it is
      # signed, release.json is uploaded and checked: RELEASING.md.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: 'false'
          files: |
            gpu-agent-*
            checksums.txt
