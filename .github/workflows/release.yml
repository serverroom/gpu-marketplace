name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track go.mod rather than a pinned version: the module already
          # requires a newer Go than the pin did, and a release build is the
          # worst place to discover a toolchain mismatch.
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME}
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o gpu-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/gpu-agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gpu-agent-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # The installers refuse to install a binary they cannot verify, so this
      # file is not optional — a release without it installs nowhere.
      - name: Generate checksums
        run: sha256sum gpu-agent-* > checksums.txt

      # An annotated tag whose message says [prerelease] is published as a
      # pre-release: installable by name ('gpu-agent update --version vX.Y.Z'),
      # never the latest release the marketplace offers to every agent. Promote
      # it with 'gh release edit vX.Y.Z --prerelease=false --latest'.
      - name: Release kind
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=false
          ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = "tag" ]; then
            msg=$(gh api "repos/${{ github.repository }}/git/tags/${ref#* }" --jq '.message')
            case "$msg" in *"[prerelease]"*) pre=true ;; esac
          fi
          echo "pre=$pre" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.pre == 'true' }}
          make_latest: ${{ steps.kind.outputs.pre == 'true' && 'false' || 'true' }}
          files: |
            gpu-agent-*
            checksums.txt
