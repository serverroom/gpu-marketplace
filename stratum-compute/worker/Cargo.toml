[package]
name = "serverroom-stratum-worker"
version = "1.0.0"
edition = "2021"
authors = ["ServerRoom Engineering"]
description = "High-performance AI compute worker using Stratum V1"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tch = { version = "0.15", features = ["download-libtorch"] }
